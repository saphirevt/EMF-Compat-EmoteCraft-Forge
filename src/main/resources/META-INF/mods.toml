modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="emf_compat_emotecraft.mixins.json"

[[dependencies.emf_compat_emotecraft]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.emf_compat_emotecraft]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.emf_compat_emotecraft]]
modId="emotecraft"
mandatory=true
versionRange="[2.2.7,2.5.0)"
ordering="AFTER"
side="CLIENT"

[[dependencies.emf_compat_emotecraft]]
modId="playeranimator"
mandatory=true
versionRange="[1.0.1,3.0.0)"
ordering="AFTER"
side="CLIENT"

[[dependencies.emf_compat_emotecraft]]
modId="bendylib"
mandatory=true
versionRange="[4.0.0,5.0.0)"
ordering="AFTER"
side="CLIENT"

[[dependencies.emf_compat_emotecraft]]
modId="entity_model_features"
mandatory=true
versionRange="[3.2.4,4.0.0)"
ordering="AFTER"
side="CLIENT"